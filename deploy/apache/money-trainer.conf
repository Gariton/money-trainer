# Money Trainer API reverse proxy
#
# Change the FQDN in this one place before enabling this file.
# The certificate file names below are derived from the same FQDN.

Define MONEY_TRAINER_FQDN api.example.local
Define MONEY_TRAINER_CERT_DIR /etc/ssl/localcerts
#
# Apache must be able to reach the Docker-published API at 127.0.0.1:8000.

<VirtualHost *:80>
    ServerName ${MONEY_TRAINER_FQDN}

    # Keep the path when redirecting HTTP to HTTPS.
    Redirect permanent / https://${MONEY_TRAINER_FQDN}/
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName ${MONEY_TRAINER_FQDN}

        SSLEngine on
        SSLCertificateFile ${MONEY_TRAINER_CERT_DIR}/${MONEY_TRAINER_FQDN}.crt
        SSLCertificateKeyFile ${MONEY_TRAINER_CERT_DIR}/${MONEY_TRAINER_FQDN}.key

        ProxyPreserveHost On
        ProxyRequests Off

        # Forward the complete API, including /health and /docs.
        ProxyPass / http://127.0.0.1:8000/ retry=0 timeout=60
        ProxyPassReverse / http://127.0.0.1:8000/

        <IfModule mod_headers.c>
            RequestHeader set X-Forwarded-Proto "https"
            RequestHeader set X-Forwarded-Port "443"
        </IfModule>

        ErrorLog ${APACHE_LOG_DIR}/money-trainer-error.log
        CustomLog ${APACHE_LOG_DIR}/money-trainer-access.log combined
    </VirtualHost>
</IfModule>
