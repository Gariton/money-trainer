model:
  architecture: yolo26n.pt
  image_size: 640
  device: auto

training:
  epochs: 100
  batch_size: 16
  patience: 20
  seed: 42
  workers: 4
  deterministic: true

dataset:
  train: 0.70
  validation: 0.15
  test: 0.15
  copy_mode: copy
  minimum_images_per_class: 1
  minimum_instances_per_class: 1
  require_reviewed: true
  require_all_classes_in_each_split: true

augmentation:
  enabled: true
  rotation_degrees: 180.0
  brightness: 0.20
  contrast: 0.20
  exposure: 0.15
  blur_probability: 0.05
  noise_probability: 0.05
  scale: 0.20
  crop_fraction: 0.05
  perspective: 0.0005
  shadow_probability: 0.05
  horizontal_flip_probability: 0.50

evaluation:
  confidence_threshold: 0.25
  low_confidence_threshold: 0.50
  iou_threshold: 0.50
  coreml_min_match_rate: 0.90
  coreml_max_mean_confidence_delta: 0.10
  coreml_min_mean_iou: 0.80
  coreml_validation_images: 8

export:
  format: coreml
  quantize: false
  nms: false

runtime:
  mock_mode: false

classes:
  - jpy_1
  - jpy_5
  - jpy_10
  - jpy_50
  - jpy_100
  - jpy_500

