[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "money-trainer-training"
version = "0.1.0"
description = "Leakage-safe YOLO training and Core ML export pipeline for Money Trainer"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0.2,<7"]
ml = [
  "ultralytics>=8.4.104,<8.5",
  "coremltools>=9.0,<10",
  "albumentations>=2.0,<3",
]
test = ["pytest>=8.3,<10"]

[project.scripts]
money-trainer = "money_trainer.cli:main"

[tool.setuptools]
packages = ["money_trainer"]
include-package-data = false

[tool.setuptools.package-data]
money_trainer = [
  "default_config.yaml",
  "assets/MockMoneyDetector.mlpackage/Manifest.json",
  "assets/MockMoneyDetector.mlpackage/Data/com.apple.CoreML/model.mlmodel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
