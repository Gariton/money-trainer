[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "money-trainer-server"
version = "0.1.0"
description = "FastAPI control plane for Money Trainer datasets, jobs, and models"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.40,<3",
  "psycopg[binary]>=3.2.9,<4",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
ml = [
  "ultralytics>=8.4.104,<8.5",
]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
